plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

def localProps = new Properties()
if (rootProject.file('local.properties').exists()) rootProject.file('local.properties').withInputStream { localProps.load(it) }

// jar_label names the jar when it serves several Minecraft versions (see versions/1.21.4/gradle.properties); otherwise the Minecraft version
version = "${mod_version}+mc${project.hasProperty('jar_label') ? jar_label : minecraft_version}"
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir(rootProject.file('src/generated/resources'))

    // files that differ for this Minecraft version (recipe and item model formats, for example) replace the shared ones of the same path
    srcDir(rootProject.file("versions/${project.name}/resources"))

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = 'CraftOfTheMine'
}

// the Java version Mojang ships for this Minecraft version (17 up to 1.20.4, 21 from 1.20.5)
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // parameter names for this Minecraft version, when Parchment has them (optional)
    if (project.hasProperty('parchment_mappings_version')) {
        parchment {
            mappingsVersion = project.parchment_mappings_version
            minecraftVersion = project.parchment_minecraft_version
        }
    }

    // the version's own access transformer when it has one (versions/<v>/resources/META-INF), else the shared one
    def versionAt = rootProject.file("versions/${project.name}/resources/META-INF/accesstransformer.cfg")
    accessTransformers.from(versionAt.exists() ? versionAt : rootProject.file('src/main/resources/META-INF/accesstransformer.cfg'))

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    // Dev conveniences live in local.properties (not in git): quickWorld=<save folder> boots straight into that
    // singleplayer world, window=1280x720 sets the window size. Without the file the client starts normally.
    def local = localProps

    runs {
        client {
            client()
            // a debug port, so `gradlew hotswap` can push changed code into the running client (see tools/HotSwap.java)
            jvmArguments.add '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005'
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (local.getProperty('quickWorld')) programArguments.addAll '--quickPlaySingleplayer', local.getProperty('quickWorld')
            if (local.getProperty('window')) {
                def wh = local.getProperty('window').split('x')
                programArguments.addAll '--width', wh[0], '--height', wh[1]
            }
        }

        // dev only: joins the world in run-auto by itself, rides the terminal and saves screenshots (see dev/AutoShots.java)
        autoClient {
            client()
            gameDirectory = project.file('run-auto')
            if (project.hasProperty('wall')) {
                systemProperty 'botwclimb.autowall', 'true' // -Pwall: the wall marker check (dev/AutoWall.java) instead of the ride
            } else {
                systemProperty 'botwclimb.autotest', 'true'
            }

            if (project.hasProperty('style')) systemProperty 'botwclimb.style', project.property('style') // -Pstyle=totk
            programArguments.addAll '--quickPlaySingleplayer', 'AutoTest', '--width', '854', '--height', '480'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            // its own folder: the client's run/mods holds Sodium, which cannot start without a window
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', rootProject.file('src/generated/resources/').getAbsolutePath(), '--existing', rootProject.file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from rootProject.file("src/main/templates")
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs << '-Xmaxerrs' << '5000' // show every error: how much a version still needs porting
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Dev-only headless planner tests (runGameTestServer) are not shipped.
tasks.named('jar') {
    exclude 'com/botwclimb/dev/**', 'data/botwclimb/structure/**'
}

// `gradlew deploy` (and every `gradlew build`) copies the built jar into a launcher's mods folder, replacing the old botwclimb jar.
// Set prismMods=<that mods folder, with forward slashes> in local.properties (not in git); without it this does nothing.
tasks.register('deploy', Copy) {
    dependsOn 'jar'
    def target = localProps.getProperty('prismMods')
    // only the version the launcher instance runs (prismVersion in local.properties, default 1.21.1): a jar for another version would not load there
    onlyIf { target != null && localProps.getProperty('prismVersion', '1.21.1') == project.minecraft_version }
    from tasks.named('jar')
    into target ?: layout.buildDirectory.dir('deploy')
    doFirst { delete fileTree(dir: target, includes: ['botwclimb-*.jar', 'CraftOfTheMine-*.jar']) }
}
tasks.named('build') { finalizedBy 'deploy' }

// `gradlew hotswap`: compile, then push the changed classes into the running dev client (no restart; method bodies only, see tools/HotSwap.java).
// Textures, models and lang files are updated by pressing F3+T in the game after this (it also rebuilds the resources).
tasks.register('hotswap', Exec) {
    dependsOn 'classes'
    commandLine System.getProperty('java.home') + '/bin/java', '--add-modules', 'jdk.jdi', rootProject.file('tools/HotSwap.java').absolutePath
    ignoreExitValue = true
}
// Optional: run the dev client on the JetBrains Runtime (jbr=<its folder> in local.properties, not in git). Its enhanced class redefinition lets a
// hot swap add and remove methods and fields too, not only change method bodies (registrations and new classes' registrations still need a restart).
if (localProps.getProperty('jbr')) {
    // Gradle must know where it is: org.gradle.java.installations.paths=<that folder> in ~/.gradle/gradle.properties
    tasks.named('runClient') {
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(java_version as int); vendor = JvmVendorSpec.JETBRAINS }
        jvmArgs '-XX:+AllowEnhancedClassRedefinition'
    }
}
tasks.named('runClient') {
    doFirst { file('build/hotswap.stamp').with { it.parentFile.mkdirs(); it.text = '' } } // everything compiled from here on counts as new
}

// Stonecutter writes this version's processed sources into the build folder, and ModDevGradle's artifact task scans the project directory
tasks.matching { it.name == 'createMinecraftArtifacts' }.configureEach { dependsOn 'stonecutterGenerate' }

tasks.named('processResources') { duplicatesStrategy = DuplicatesStrategy.INCLUDE } // the version's own files are copied last and win

// the ride's motion blur shaders use the pre-1.21.2 format and are not shipped on later versions (the blur is switched off there)
if (stonecutter.eval(stonecutter.current.version, ">=1.21.2")) {
    tasks.named('processResources') { exclude 'assets/botwclimb/shaders/**' }
}

// Minecraft 1.21.11 renamed ResourceLocation to Identifier: Stonecutter swaps the name in every source file for that version
stonecutter {
    replacements {
        // the old annotation-based test framework is gone from 1.21.5; the mod's own annotations take over
        string {
            direction = eval(current.version, '>=1.21.5')
            replace 'import net.minecraft.gametest.framework.GameTest;', 'import com.botwclimb.dev.GameTest;'
            replace 'import net.neoforged.neoforge.gametest.GameTestHolder;', 'import com.botwclimb.dev.GameTestHolder;'
            replace 'import net.neoforged.neoforge.gametest.PrefixGameTestTemplate;', 'import com.botwclimb.dev.PrefixGameTestTemplate;'
        }
        // the cutout-no-cull render type of 1.21.11 (26.1 calls it entityCutout)
        string {
            direction = eval(current.version, '>=1.21.11') && !eval(current.version, '>=26.1')
            replace 'RenderType.entityCutoutNoCull(', 'net.minecraft.client.renderer.rendertype.RenderTypes.entityCutoutNoCull('
            replace 'RenderType::entityCutoutNoCull', 'net.minecraft.client.renderer.rendertype.RenderTypes::entityCutoutNoCull'
        }
        // 26.1 renamed the GUI drawing class and its methods, and moved some render state classes
        string {
            direction = eval(current.version, '>=26.1')
            replace 'RenderType.entityCutoutNoCull(', 'net.minecraft.client.renderer.rendertype.RenderTypes.entityCutout('
            replace 'RenderType::entityCutoutNoCull', 'net.minecraft.client.renderer.rendertype.RenderTypes::entityCutout'
            replace 'public void renderBackground(GuiGraphics g, int mx, int my, float pt)', 'public void extractBackground(GuiGraphicsExtractor g, int mx, int my, float pt)'
            replace 'public void render(GuiGraphics g, int mx, int my, float pt)', 'public void extractRenderState(GuiGraphicsExtractor g, int mx, int my, float pt)'
            replace 'renderBackground(g, mx, my, pt);', 'extractBackground(g, mx, my, pt);'
            replace 'g.renderOutline(', 'g.outline('
            replace 'g.submitEntityRenderState(', 'g.entity('
            replace 'protected int getLightColor(float partialTick)', 'protected int getLightCoords(float partialTick)'
            replace 'target.guiRenderState.submitGuiElement(', 'target.submitGuiElementRenderState('
            replace 'net.minecraft.client.gui.render.state.GuiElementRenderState', 'net.minecraft.client.renderer.state.gui.GuiElementRenderState'
            replace 'SavedDataType<>(NAME,', 'SavedDataType<>(net.minecraft.resources.Identifier.fromNamespaceAndPath("botwclimb", "plots"),'
            replace 'GuiGraphics', 'GuiGraphicsExtractor'
            replace 'g.drawString(', 'g.text('
            replace 'g.drawCenteredString(', 'g.centeredText('
            replace 'g.renderItem(', 'g.item('
            replace 'g.renderItemDecorations(', 'g.itemDecorations('
            replace 'import net.minecraft.client.renderer.LightTexture;', 'import net.minecraft.util.LightCoordsUtil;'
            replace 'LightTexture', 'LightCoordsUtil'
            replace 'PlayerFaceRenderer.draw(', 'PlayerFaceExtractor.extractRenderState('
            replace 'level.setDayTime(6000);', 'level.getServer().getCommands().performPrefixedCommand(level.getServer().createCommandSourceStack(), "time set noon");'
            replace 'net.minecraft.client.renderer.state.CameraRenderState', 'net.minecraft.client.renderer.state.level.CameraRenderState'
            replace 'net.minecraft.client.renderer.state.QuadParticleRenderState', 'net.minecraft.client.renderer.state.level.QuadParticleRenderState'
            replace 'BlockEvent.BreakEvent', 'net.neoforged.neoforge.event.level.block.BreakBlockEvent'
            replace 'RenderLevelStageEvent.AfterParticles', 'RenderLevelStageEvent.AfterTranslucentParticles'
        }
        // 26.2 reorganised items, entity types and the client's screens and render buffers
        string {
            direction = eval(current.version, '>=26.2')
            replace 'EntityType.COW', 'EntityTypes.COW'
            replace 'EntityType.ARROW', 'EntityTypes.ARROW'
            replace 'EntityType.MINECART', 'EntityTypes.MINECART'
            replace 'import net.minecraft.client.renderer.MultiBufferSource;', 'import net.minecraft.client.renderer.SubmitNodeCollector;'
            replace 'Minecraft.getInstance().screen', 'Minecraft.getInstance().gui.screen()'
            replace 'mc.screen', 'mc.gui.screen()'
            replace 'Minecraft.getInstance().setScreen(', 'Minecraft.getInstance().gui.setScreen('
            replace 'minecraft.setScreen(', 'minecraft.gui.setScreen('
            replace 'mc.setScreen(', 'mc.gui.setScreen('
            replace 'mc.options.hideGui', 'mc.gui.hud.isHidden()'
            replace 'mc.levelRenderer.needsUpdate();', '// the level renderer needs no nudge after a camera change (26.2 and later)'
            replace 'mc.levelRenderer.destroyBlockProgress(', 'mc.level.destroyBlockProgress('
            replace 'gameRenderer.getMainCamera()', 'gameRenderer.mainCamera()'
            replace 'mc.getMainRenderTarget()', 'mc.gameRenderer.mainRenderTarget()'
            replace 'Items.WHITE_WOOL', 'Items.WOOL.white()'
            replace 'Items.WHITE_DYE', 'Items.DYE.white()'
            replace 'Items.ORANGE_WOOL', 'Items.WOOL.orange()'
            replace 'Items.ORANGE_DYE', 'Items.DYE.orange()'
            replace 'Items.MAGENTA_WOOL', 'Items.WOOL.magenta()'
            replace 'Items.MAGENTA_DYE', 'Items.DYE.magenta()'
            replace 'Items.LIGHT_BLUE_WOOL', 'Items.WOOL.lightBlue()'
            replace 'Items.LIGHT_BLUE_DYE', 'Items.DYE.lightBlue()'
            replace 'Items.YELLOW_WOOL', 'Items.WOOL.yellow()'
            replace 'Items.YELLOW_DYE', 'Items.DYE.yellow()'
            replace 'Items.LIME_WOOL', 'Items.WOOL.lime()'
            replace 'Items.LIME_DYE', 'Items.DYE.lime()'
            replace 'Items.PINK_WOOL', 'Items.WOOL.pink()'
            replace 'Items.PINK_DYE', 'Items.DYE.pink()'
            replace 'Items.GRAY_WOOL', 'Items.WOOL.gray()'
            replace 'Items.GRAY_DYE', 'Items.DYE.gray()'
            replace 'Items.LIGHT_GRAY_WOOL', 'Items.WOOL.lightGray()'
            replace 'Items.LIGHT_GRAY_DYE', 'Items.DYE.lightGray()'
            replace 'Items.CYAN_WOOL', 'Items.WOOL.cyan()'
            replace 'Items.CYAN_DYE', 'Items.DYE.cyan()'
            replace 'Items.PURPLE_WOOL', 'Items.WOOL.purple()'
            replace 'Items.PURPLE_DYE', 'Items.DYE.purple()'
            replace 'Items.BLUE_WOOL', 'Items.WOOL.blue()'
            replace 'Items.BLUE_DYE', 'Items.DYE.blue()'
            replace 'Items.BROWN_WOOL', 'Items.WOOL.brown()'
            replace 'Items.BROWN_DYE', 'Items.DYE.brown()'
            replace 'Items.GREEN_WOOL', 'Items.WOOL.green()'
            replace 'Items.GREEN_DYE', 'Items.DYE.green()'
            replace 'Items.RED_WOOL', 'Items.WOOL.red()'
            replace 'Items.RED_DYE', 'Items.DYE.red()'
            replace 'Items.BLACK_WOOL', 'Items.WOOL.black()'
            replace 'Items.BLACK_DYE', 'Items.DYE.black()'
        }
        // 26.3 swapped GLFW for SDL, took the block codecs and several packet helpers away, and moved the pipeline API
        string {
            direction = eval(current.version, '>=26.3')
            replace 'com.mojang.blaze3d.pipeline.RenderPipeline', 'com.mojang.renderpearl.api.pipeline.RenderPipeline'
            replace 'ps.mulPose(Axis.', 'ps.rotate(Axis.'
            replace 'event.getPoseStack().mulPose(Axis.', 'event.getPoseStack().rotate(Axis.'
            replace 'p.hurtMarked = true', 'p.needsSync = true'
            replace 'p.getInventory().placeItemBackInInventory(new ItemStack(item, n));', '{ var back = new ItemStack(item, n); if (!p.getInventory().add(back)) p.spawnAtLocation(com.botwclimb.common.Compat.level(p), back); }'
            replace 'getGuiLeft()', 'leftPos'
            replace 'getGuiTop()', 'topPos'
            replace 'getXSize()', 'imageWidth'
            replace 'getYSize()', 'imageHeight'
        }
        // the GUI draws tooltips at the end of the frame from 1.21.6
        string {
            direction = eval(current.version, '>=1.21.6')
            replace 'g.renderTooltip(', 'g.setTooltipForNextFrame('
        }
        // GameTestHelper.fail takes a Component from 1.21.5 to 1.21.8
        string {
            direction = eval(current.version, '>=1.21.5') && !eval(current.version, '>=1.21.9')
            replace 'h.fail(', 'com.botwclimb.dev.TestCompat.fail(h, '
        }
        // renamed or moved in 1.21.9
        string {
            direction = eval(current.version, '>=1.21.9')
            replace 'ReceivingLevelScreen', 'LevelLoadingScreen'
            replace 'import net.minecraft.client.particle.TextureSheetParticle;', 'import net.minecraft.client.particle.SingleQuadParticle;'
            replace 'extends TextureSheetParticle', 'extends SingleQuadParticle'
            replace 'client.particle.TextureSheetParticle sq', 'client.particle.SingleQuadParticle sq'
            replace 'PlayerRenderState', 'AvatarRenderState'
            replace 'net.minecraft.client.resources.PlayerSkin', 'net.minecraft.world.entity.player.PlayerSkin'
        }
        // GuiGraphics.renderOutline was called submitOutline in 1.21.9 and 1.21.10
        string {
            direction = eval(current.version, '>=1.21.9') && !eval(current.version, '>=1.21.11')
            replace 'g.renderOutline(', 'g.submitOutline('
        }
        string {
            direction = eval(current.version, '>=1.21.11')
            replace 'ResourceLocation', 'Identifier'
            replace 'camera.getLeftVector()', 'camera.leftVector()'
            // classes that moved or were renamed in 1.21.11
            replace 'net.minecraft.client.model.PlayerModel', 'net.minecraft.client.model.player.PlayerModel'
            replace 'net.minecraft.world.entity.projectile.AbstractArrow', 'net.minecraft.world.entity.projectile.arrow.AbstractArrow'
            replace 'net.minecraft.client.renderer.RenderType', 'net.minecraft.client.renderer.rendertype.RenderType'
            replace 'net.minecraft.Util', 'net.minecraft.util.Util'
            replace '.location()', '.identifier()'
            // the render type factories moved to their own class
            replace 'RenderType.debugQuads(', 'net.minecraft.client.renderer.rendertype.RenderTypes.debugQuads('
            replace 'RenderType.entityTranslucentEmissive(', 'net.minecraft.client.renderer.rendertype.RenderTypes.entityTranslucentEmissive('
            replace 'RenderType.eyes(', 'net.minecraft.client.renderer.rendertype.RenderTypes.eyes('
            replace 'RenderType.lightning(', 'net.minecraft.client.renderer.rendertype.RenderTypes.lightning('
        }
    }
}
